<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWS AI Assistant</title>
    <!-- Google Font: Livvic -->
    <link href="https://fonts.googleapis.com/css2?family=Livvic:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ─── Global Styles ─────────────────────────────────────────────────── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Livvic', sans-serif;
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ─── Main Container ────────────────────────────────────────────────── */
        .chat-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 700px;
            height: 100vh;
            background: white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        /* ─── Header ────────────────────────────────────────────────────────── */
        .header {
            background-color: #1e40af;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            border-bottom: 2px solid #1e3a8a;
        }

        /* ─── Chat Messages Area ────────────────────────────────────────────── */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background-color: white;
        }

        .message {
            display: flex;
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ─── User Message (Right side, Blue) ──────────────────────────────── */
        .message.user {
            justify-content: flex-end;
        }

        .message.user .message-content {
            background-color: #1e40af;
            color: white;
            padding: 12px 16px;
            border-radius: 12px 0px 12px 12px;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 14px;
        }

        /* ─── Bot Message (Left side, White) ────────────────────────────────── */
        .message.bot {
            justify-content: flex-start;
        }

        .message.bot .message-content {
            background-color: #f0f0f0;
            color: #333;
            padding: 12px 16px;
            border-radius: 0px 12px 12px 12px;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 14px;
        }

        /* ─── Sources (small grey text below bot message) ──────────────────── */
        .message-sources {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
            padding-left: 5px;
            font-style: italic;
        }

        /* ─── Typing Indicator ──────────────────────────────────────────────── */
        .message.typing .message-content {
            background-color: #f0f0f0;
            color: #666;
            padding: 12px 16px;
            border-radius: 0px 12px 12px 12px;
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background-color: #999;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                opacity: 0.5;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        /* ─── Input Area ────────────────────────────────────────────────────── */
        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            background-color: #f8f9fa;
            border-top: 1px solid #e0e0e0;
        }

        .input-area input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-family: 'Livvic', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-area input:focus {
            border-color: #1e40af;
        }

        .input-area button {
            background-color: #1e40af;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-family: 'Livvic', sans-serif;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        .input-area button:hover {
            background-color: #1e3a8a;
        }

        .input-area button:active {
            transform: scale(0.98);
        }

        /* ─── Scroll bar styling ────────────────────────────────────────────── */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #1e40af;
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #1e3a8a;
        }

        /* ─── Welcome message ───────────────────────────────────────────────── */
        .welcome-message {
            text-align: center;
            color: #999;
            font-size: 16px;
            margin-top: 40px;
        }

        /* ─── Error message ────────────────────────────────────────────────── */
        .error-message {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <!-- Main Chat Container -->
    <div class="chat-container">
        <!-- Header -->
        <div class="header">
            🤖 SWS AI Assistant
        </div>

        <!-- Chat Messages Area -->
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                <div class="message-content">
                    Hello! 👋 Ask me anything about SWS AI company policies.
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Type your question here..."
                autocomplete="off"
            >
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // ─── Configuration ───────────────────────────────────────────────────
        const API_URL = "http://localhost:8000/api/chat";
        const chatMessages = document.getElementById("chatMessages");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");

        // ─── Event Listeners ──────────────────────────────────────────────────
        // Send message on button click
        sendBtn.addEventListener("click", sendMessage);

        // Send message on Enter key press
        userInput.addEventListener("keypress", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        });

        // ─── Function: Send Message ──────────────────────────────────────────
        async function sendMessage() {
            const question = userInput.value.trim();

            // Validate input
            if (!question) {
                alert("Please enter a question.");
                return;
            }

            // Disable input and button while sending
            userInput.disabled = true;
            sendBtn.disabled = true;

            try {
                // Add user message to chat
                addMessage("user", question);
                userInput.value = "";

                // Show typing indicator
                const typingId = addTypingIndicator();

                // Call backend API
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ question }),
                });

                // Remove typing indicator
                removeTypingIndicator(typingId);

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                const data = await response.json();

                // Add bot message
                addMessage("bot", data.answer, data.sources);

            } catch (error) {
                console.error("Error:", error);
                addMessage("bot", "❌ Something went wrong. Try again.");
            } finally {
                // Re-enable input and button
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        // ─── Function: Add Message to Chat ────────────────────────────────
        function addMessage(sender, text, sources = []) {
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${sender}`;

            const contentDiv = document.createElement("div");
            contentDiv.className = "message-content";
            contentDiv.textContent = text;

            messageDiv.appendChild(contentDiv);

            // Add sources if bot message
            if (sender === "bot" && sources.length > 0) {
                const sourcesDiv = document.createElement("div");
                sourcesDiv.className = "message-sources";
                sourcesDiv.textContent = `📄 Sources: ${sources.join(", ")}`;
                messageDiv.appendChild(sourcesDiv);
            }

            chatMessages.appendChild(messageDiv);

            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ─── Function: Add Typing Indicator ────────────────────────────────
        function addTypingIndicator() {
            const messageDiv = document.createElement("div");
            messageDiv.className = "message bot typing";
            messageDiv.id = "typing-indicator";

            const contentDiv = document.createElement("div");
            contentDiv.className = "message-content";

            for (let i = 0; i < 3; i++) {
                const dot = document.createElement("div");
                dot.className = "typing-dot";
                contentDiv.appendChild(dot);
            }

            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);

            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return "typing-indicator";
        }

        // ─── Function: Remove Typing Indicator ───────────────────────────
        function removeTypingIndicator(id) {
            const typingElement = document.getElementById(id);
            if (typingElement) {
                typingElement.remove();
            }
        }

        // ─── Auto-focus input on page load ────────────────────────────────
        userInput.focus();
    </script>
</body>
</html>
